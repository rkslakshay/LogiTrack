name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Fully offline: no external routing during tests.
  ROUTING_PROVIDER: local

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    # LogiTrack is developed on Windows: the same checks run on Windows and Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Scripts from the registry do not run; Prisma's client is generated explicitly.
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Dependency audit (fails on high or critical advisories)
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        # The config starts its own server on port 3100 with a fresh seeded prisma/e2e.db.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
